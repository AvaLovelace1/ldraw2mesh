name: Release
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  wheels:
    name: wheels-${{ matrix.platform.os }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: windows-latest, target: x64 }
          - { os: macos-14, target: aarch64 }
    steps:
      - uses: actions/checkout@v7
      # One wheel is built per interpreter (the extension is not abi3), so every
      # targeted version must actually be present on the runner.
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || '' }}
          args: --release --out dist --interpreter 3.10 3.11 3.12 3.13 3.14
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    needs: [ wheels, sdist ]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
